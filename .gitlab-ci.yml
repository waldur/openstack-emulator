include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/stages.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/check-merge-compatibility.yml"
  # NOTE: /templates/test/lint-md-files.yml not included — the existing
  # docs/{api-compliance,architecture/*,scenarios,usage}.md files have
  # hundreds of pre-existing MD009/MD022/MD032/MD034/MD040 violations.
  # Add the include once those are cleaned up as a separate pass.
  - project: "waldur/waldur-pipelines"
    file: "/templates/release/publish-multiarch.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/license-scan.yml"

variables:
  COMPONENT_VERSION: "latest"

# Run in merge-request pipelines (so lint/type/test gate the merge), on the
# default branch, and on tags. On a feature branch with an open MR only the
# merge_request_event pipeline matches, so we don't get duplicate branch+MR
# pipelines. Without a merge_request_event rule these jobs run only in branch
# pipelines, which GitLab does not treat as the MR merge gate — that gap let a
# red branch pipeline merge behind a green (near-empty) MR pipeline.
.gate-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: $CI_COMMIT_TAG

.python-setup:
  image: registry.hpc.ut.ee/mirror/library/python:3.12-bullseye
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

Run linters:
  extends: [.python-setup, .gate-rules]
  stage: test
  script:
    - ruff format --check .
    - ruff check .

Run type checkings:
  extends: [.python-setup, .gate-rules]
  stage: test
  script:
    - mypy emulator

.test-base:
  extends: .gate-rules
  stage: test
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - pytest --cov=emulator --cov-report=xml --cov-report=term-missing
  artifacts:
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

Run tests v3.10:
  extends: .test-base
  image: registry.hpc.ut.ee/mirror/library/python:3.10-bullseye

Run tests v3.11:
  extends: .test-base
  image: registry.hpc.ut.ee/mirror/library/python:3.11-bullseye

Run tests v3.12:
  extends: .test-base
  image: registry.hpc.ut.ee/mirror/library/python:3.12-bullseye

Run tests v3.13:
  extends: .test-base
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bullseye

Lint Helm chart:
  image:
    name: "registry.hpc.ut.ee/mirror/alpine/helm:3.12.3"
    entrypoint: [""]
  stage: test
  interruptible: true
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - charts/openstack-emulator/**/*
        - .gitlab-ci.yml
  before_script:
    - helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.8.2
  script:
    - helm lint charts/openstack-emulator/
    - helm unittest charts/openstack-emulator/
    # Render the default install and every optional-feature variant — failures here
    # catch templating regressions (missing values, invalid go-template, wrong indent).
    - mkdir -p rendered-templates/default && helm template ose charts/openstack-emulator/ --output-dir rendered-templates/default --debug
    - mkdir -p rendered-templates/preset && helm template ose charts/openstack-emulator/ --output-dir rendered-templates/preset --set preset.name=development
    # customPreset.yaml is a placeholder body — chart templating doesn't validate preset schema.
    - mkdir -p rendered-templates/customPreset && helm template ose charts/openstack-emulator/ --output-dir rendered-templates/customPreset --set customPreset.enabled=true --set-string customPreset.yaml=placeholder
    - mkdir -p rendered-templates/persistence && helm template ose charts/openstack-emulator/ --output-dir rendered-templates/persistence --set persistence.enabled=true
    - mkdir -p rendered-templates/ingress && helm template ose charts/openstack-emulator/ --output-dir rendered-templates/ingress --set ingress.enabled=true --set 'ingress.hosts[0].host=ose.example.com' --set 'ingress.hosts[0].paths[0].path=/' --set 'ingress.hosts[0].paths[0].pathType=Prefix' --set 'ingress.hosts[0].paths[0].port=10000'
    - mkdir -p rendered-templates/gatewayApi && helm template ose charts/openstack-emulator/ --output-dir rendered-templates/gatewayApi --set gatewayApi.enabled=true --set gatewayApi.createGateway=true --set gatewayApi.gateway.gatewayClassName=envoy --set 'gatewayApi.hostnames[0]=ose.example.com' --set 'gatewayApi.rules[0].matches[0].path.type=PathPrefix' --set 'gatewayApi.rules[0].matches[0].path.value=/' --set 'gatewayApi.rules[0].port=10000'
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - rendered-templates

Publish chart to GitHub Pages:
  # Publishes the Helm chart by pushing a packaged .tgz + updated index.yaml
  # to the gh-pages branch of the GitHub mirror at
  # github.com/waldur/openstack-emulator. GitHub Pages serves the branch at
  # https://waldur.github.io/openstack-emulator/. Users:
  #   helm repo add openstack-emulator https://waldur.github.io/openstack-emulator/
  #   helm install ose openstack-emulator/openstack-emulator --version X.Y.Z
  #
  # Versioning model: the tag IS the chart version. This job rewrites
  # charts/openstack-emulator/Chart.yaml's `version:` and `appVersion:` to
  # $CI_COMMIT_TAG at publish time, so the .tgz filename, the index and the
  # deployed image tag all reflect the tag. The matching :$CI_COMMIT_TAG image
  # is pushed by the "Publish docker image" job below.
  #
  # Requires the CI variable $OPENNODE_JENKINS_GITHUB_TOKEN (same one
  # waldur-helm uses) to be configured at Settings → CI/CD → Variables, with
  # write access to the GitHub mirror.
  image:
    name: "registry.hpc.ut.ee/mirror/alpine/helm:3.12.3"
    entrypoint: [""]
  stage: release
  interruptible: false
  # The published chart pins appVersion (and therefore image.tag) to this tag.
  # Publishing it before the image exists would put a .tgz on gh-pages that
  # installs to ImagePullBackOff, and gh-pages entries are not retractable —
  # fixing it would mean republishing the same chart version.
  needs:
    - job: Publish docker image
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: $CI_COMMIT_TAG
  variables:
    GITHUB_REPO: "waldur/openstack-emulator"
    PAGES_URL: "https://waldur.github.io/openstack-emulator"
  before_script:
    - apk add --no-cache git
  script:
    # Bump chart version AND appVersion to match the tag, then package. appVersion
    # is the image tag the chart deploys (templates/_helpers.tpl defaults the image
    # tag to .Chart.AppVersion), and the versioned image is published below.
    - 'sed -i "s/^version:.*/version: ${CI_COMMIT_TAG}/" charts/openstack-emulator/Chart.yaml'
    - 'sed -i "s/^appVersion:.*/appVersion: \"${CI_COMMIT_TAG}\"/" charts/openstack-emulator/Chart.yaml'
    - 'grep -E "^version:|^appVersion:" charts/openstack-emulator/Chart.yaml'
    - mkdir -p /tmp/dist
    - helm package charts/openstack-emulator/ -d /tmp/dist/
    # Configure git and add the GitHub mirror as a remote.
    - git config user.name "Opennode Jenkins"
    - git config user.email jenkins@opennodecloud.com
    - git remote remove github-origin 2>/dev/null || true
    - git remote add github-origin "https://opennode-jenkins:${OPENNODE_JENKINS_GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    - git fetch github-origin
    # Switch to gh-pages (create as orphan on the very first publish).
    - |
      # -f is required: the sed above leaves Chart.yaml modified, and it does not
      # exist on gh-pages, so a plain checkout refuses to discard it and aborts.
      # Safe here — the chart is already packaged into /tmp/dist at this point.
      if git ls-remote --exit-code github-origin gh-pages >/dev/null; then
        git checkout -f -B gh-pages github-origin/gh-pages
      else
        git checkout --orphan gh-pages
        git rm -rf . || true
      fi
    # Place the new tarball under charts/ and rebuild the index over all
    # tarballs present in the branch (old versions stay reachable).
    - mkdir -p charts
    - mv "/tmp/dist/openstack-emulator-${CI_COMMIT_TAG}.tgz" charts/
    - helm repo index . --url "${PAGES_URL}"
    # A landing page, so the repo root is not a bare 404 for anyone who pastes
    # the URL into a browser. helm itself only ever reads index.yaml.
    # .nojekyll keeps GitHub Pages from running the files through Jekyll.
    - touch .nojekyll
    - |
      versions=""
      for f in $(ls charts/*.tgz | sort -Vr 2>/dev/null || ls charts/*.tgz | sort -r); do
        v=$(basename "$f" .tgz | sed "s/^openstack-emulator-//")
        versions="${versions}<li><code>${v}</code> &middot; <a href=\"${PAGES_URL}/${f}\">tarball</a></li>"
      done
      cat > index.html <<HTML
      <!doctype html>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>OpenStack Emulator Helm chart</title>
      <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #5c5c5c; --bg: #fff; --code-bg: #f4f4f5; --border: #e4e4e7; --link: #0b5fff; }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #e8e8ea; --muted: #a1a1aa; --bg: #131316; --code-bg: #1e1e22; --border: #2e2e35; --link: #7aa7ff; }
      }
      * { box-sizing: border-box; }
      body { margin: 0 auto; padding: 3rem 1.25rem 5rem; max-width: 46rem; background: var(--bg); color: var(--fg);
             font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      h1 { font-size: 1.7rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
      h2 { font-size: 1.05rem; margin: 2.5rem 0 .75rem; letter-spacing: -.01em; }
      p.lead { color: var(--muted); margin: 0 0 2rem; }
      a { color: var(--link); }
      code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; font-size: .9em; }
      pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
            padding: 1rem; overflow-x: auto; font-size: .875rem; line-height: 1.5; }
      pre code { background: none; padding: 0; font-size: inherit; }
      ul { padding-left: 1.2rem; }
      li { margin: .2rem 0; }
      footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .875rem; }
      </style>
      <h1>OpenStack Emulator Helm chart</h1>
      <p class="lead">A Helm chart repository. Latest release: <code>${CI_COMMIT_TAG}</code>.</p>

      <h2>Install</h2>
      <pre><code>helm repo add openstack-emulator ${PAGES_URL}/
      helm repo update

      helm install openstack-emulator openstack-emulator/openstack-emulator \\
        --namespace openstack-emulator --create-namespace --wait</code></pre>
      <p>Pin a version with <code>--version ${CI_COMMIT_TAG}</code>. The chart version equals
      the emulator release tag, and the image it deploys carries the same tag.</p>

      <h2>Available versions</h2>
      <ul>${versions}</ul>
      <p>The machine-readable listing is <a href="${PAGES_URL}/index.yaml">index.yaml</a> — that
      is the only file <code>helm</code> itself reads.</p>

      <footer>
      Source and documentation: <a href="https://code.opennodecloud.com/${GITHUB_REPO}">code.opennodecloud.com/${GITHUB_REPO}</a><br>
      Mirrored at <a href="https://github.com/${GITHUB_REPO}">github.com/${GITHUB_REPO}</a>.
      This page is regenerated by CI on each release.
      </footer>
      HTML
    - git add charts/ index.yaml index.html .nojekyll
    - git status
    - git commit -m "Release ${CI_COMMIT_TAG}"
    - git push github-origin gh-pages

Publish docker image:
  stage: release
  interruptible: true
  image:
    name: quay.io/containers/buildah:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # Release tag -> publish the versioned image (and move :latest to it).
    - if: '$CI_COMMIT_TAG'
    # Default-branch push -> refresh :latest.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
    DOCKER_HUB_REGISTRY: "docker.io"
    IMAGE_REPO: "opennode/openstack-emulator"
  before_script:
    - echo "${WALDUR_DOCKER_HUB_PASSWORD}" | buildah login -u "${WALDUR_DOCKER_HUB_USER}" --password-stdin "${DOCKER_HUB_REGISTRY}"
  script:
    # On a release tag VERSION is the tag and we publish both :<tag> and :latest;
    # on default-branch pushes we publish :latest only.
    - VERSION="${CI_COMMIT_TAG:-latest}"
    - echo "[+] Building ${IMAGE_REPO} (version=${VERSION})"
    - |
      buildah bud \
        --build-arg COMMIT_INFO="${CI_COMMIT_SHA}" \
        --build-arg VERSION="${VERSION}" \
        -t "${IMAGE_REPO}:latest" \
        -f "${CI_PROJECT_DIR}/Dockerfile" \
        "${CI_PROJECT_DIR}"
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        buildah tag "${IMAGE_REPO}:latest" "${IMAGE_REPO}:${CI_COMMIT_TAG}"
        buildah push "${IMAGE_REPO}:${CI_COMMIT_TAG}" "docker://${IMAGE_REPO}:${CI_COMMIT_TAG}"
      fi
    - buildah push "${IMAGE_REPO}:latest" "docker://${IMAGE_REPO}:latest"

# Fails when a dependency arrives under a licence Waldur cannot ship — strong
# copyleft (GPL, AGPL), source-available (SSPL, BUSL, Elastic) or non-OSI
# use-restricted (Hippocratic, JSON). LGPL and MPL pass but stay listed in the
# job artifact. See waldur/waldur-mastermind#285.
#
# The job only runs on merge requests that touch pyproject.toml or uv.lock, plus
# the default branch and release tags.
#
# allow_failure is inherited as true from the template, so this cannot redden an
# MR while it is being adopted. Override it with `allow_failure: false` to make
# the gate binding once this repo is known clean.
Check dependency licences:
  extends: .Licence gate (python) template
