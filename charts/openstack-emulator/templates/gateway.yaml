{{- if and .Values.gatewayApi.enabled .Values.gatewayApi.createGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "openstack-emulator.fullname" . }}
  labels:
    {{- include "openstack-emulator.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ required "gatewayApi.gateway.gatewayClassName is required when createGateway is true" .Values.gatewayApi.gateway.gatewayClassName | quote }}
  listeners:
    - name: {{ .Values.gatewayApi.gateway.listenerName | quote }}
      port: {{ .Values.gatewayApi.gateway.listenerPort }}
      protocol: {{ .Values.gatewayApi.gateway.listenerProtocol | quote }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
