name: microservices
description: "Microservices architecture with service mesh, API gateway, multiple services, and observability stack"

keystone:
  projects:
    - name: platform
      description: "Platform infrastructure (gateway, service mesh, observability)"
      users:
        - name: platform-admin
          password: platform-2024
          email: platform@microservices.local
          roles: [admin, member]

    - name: services
      description: "Business services"
      users:
        - name: services-admin
          password: services-2024
          email: services@microservices.local
          roles: [admin, member]
        - name: services-deploy
          password: deploy-2024
          email: deploy@microservices.local
          roles: [member]

    - name: data
      description: "Data services (databases, caches, queues)"
      users:
        - name: data-admin
          password: data-2024
          email: data@microservices.local
          roles: [admin, member]

glance:
  images:
    - name: alpine-3.18
      visibility: public
      disk_format: qcow2
      container_format: bare
      min_disk: 1
      min_ram: 256
      os_distro: alpine
      os_version: "3.18"

    - name: debian-12-minimal
      visibility: public
      disk_format: qcow2
      container_format: bare
      min_disk: 5
      min_ram: 512
      os_distro: debian
      os_version: "12"

neutron:
  networks:
    # Public ingress network
    - name: ingress-network
      project: platform
      external: false
      subnets:
        - name: ingress-subnet
          cidr: "10.0.0.0/24"
          gateway: "10.0.0.1"
          dns_nameservers:
            - "10.10.0.10"

    # Service mesh network
    - name: mesh-network
      project: platform
      shared: true
      subnets:
        - name: mesh-subnet
          cidr: "10.10.0.0/20"
          gateway: "10.10.0.1"
          dns_nameservers:
            - "10.10.0.10"
          allocation_pools:
            - start: "10.10.0.100"
              end: "10.10.15.250"

    # Services network - Frontend tier
    - name: frontend-network
      project: services
      subnets:
        - name: frontend-subnet
          cidr: "10.20.1.0/24"
          gateway: "10.20.1.1"
          dns_nameservers:
            - "10.10.0.10"

    # Services network - Backend tier
    - name: backend-network
      project: services
      subnets:
        - name: backend-subnet
          cidr: "10.20.2.0/24"
          gateway: "10.20.2.1"
          dns_nameservers:
            - "10.10.0.10"

    # Services network - Internal APIs
    - name: internal-api-network
      project: services
      subnets:
        - name: internal-api-subnet
          cidr: "10.20.3.0/24"
          gateway: "10.20.3.1"
          dns_nameservers:
            - "10.10.0.10"

    # Data network - Databases
    - name: database-network
      project: data
      subnets:
        - name: database-subnet
          cidr: "10.30.1.0/24"
          gateway: "10.30.1.1"
          dns_nameservers:
            - "10.10.0.10"

    # Data network - Cache
    - name: cache-network
      project: data
      subnets:
        - name: cache-subnet
          cidr: "10.30.2.0/24"
          gateway: "10.30.2.1"
          dns_nameservers:
            - "10.10.0.10"

    # Data network - Message Queue
    - name: queue-network
      project: data
      subnets:
        - name: queue-subnet
          cidr: "10.30.3.0/24"
          gateway: "10.30.3.1"
          dns_nameservers:
            - "10.10.0.10"

  security_groups:
    # API Gateway
    - name: api-gateway
      description: "API Gateway - public entry point"
      project: platform
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 80
          port_range_max: 80
          remote_ip_prefix: "0.0.0.0/0"
        - direction: ingress
          protocol: tcp
          port_range_min: 443
          port_range_max: 443
          remote_ip_prefix: "0.0.0.0/0"
        - direction: ingress
          protocol: tcp
          port_range_min: 8080
          port_range_max: 8080
          remote_ip_prefix: "10.0.0.0/8"

    # Service mesh control plane
    - name: mesh-control
      description: "Service mesh control plane"
      project: platform
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 15010
          port_range_max: 15014
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 9090
          port_range_max: 9090
          remote_ip_prefix: "10.0.0.0/8"

    # Service mesh sidecar
    - name: mesh-sidecar
      description: "Service mesh sidecar proxy"
      project: platform
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 15001
          port_range_max: 15001
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 15006
          port_range_max: 15006
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 15090
          port_range_max: 15090
          remote_ip_prefix: "10.0.0.0/8"

    # Observability
    - name: observability
      description: "Observability stack (metrics, logs, traces)"
      project: platform
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 9090
          port_range_max: 9090
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 3000
          port_range_max: 3000
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 16686
          port_range_max: 16686
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 14268
          port_range_max: 14268
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 9200
          port_range_max: 9200
          remote_ip_prefix: "10.0.0.0/8"

    # Frontend services
    - name: frontend-svc
      description: "Frontend services"
      project: services
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 3000
          port_range_max: 3000
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 8080
          port_range_max: 8080
          remote_ip_prefix: "10.0.0.0/8"

    # Backend services
    - name: backend-svc
      description: "Backend services"
      project: services
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 8080
          port_range_max: 8080
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 9000
          port_range_max: 9000
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 50051
          port_range_max: 50051
          remote_ip_prefix: "10.0.0.0/8"

    # Database services
    - name: database-svc
      description: "Database services"
      project: data
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 5432
          port_range_max: 5432
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 27017
          port_range_max: 27017
          remote_ip_prefix: "10.0.0.0/8"

    # Cache services
    - name: cache-svc
      description: "Cache services"
      project: data
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 6379
          port_range_max: 6379
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 11211
          port_range_max: 11211
          remote_ip_prefix: "10.0.0.0/8"

    # Queue services
    - name: queue-svc
      description: "Message queue services"
      project: data
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 5672
          port_range_max: 5672
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 15672
          port_range_max: 15672
          remote_ip_prefix: "10.0.0.0/8"
        - direction: ingress
          protocol: tcp
          port_range_min: 9092
          port_range_max: 9092
          remote_ip_prefix: "10.0.0.0/8"

  routers:
    - name: ingress-router
      project: platform
      external_network: external
      interfaces:
        - subnet: ingress-subnet

    - name: mesh-router
      project: platform
      external_network: external
      interfaces:
        - subnet: mesh-subnet

    - name: frontend-router
      project: services
      external_network: external
      interfaces:
        - subnet: frontend-subnet

    - name: backend-router
      project: services
      external_network: external
      interfaces:
        - subnet: backend-subnet

    - name: internal-api-router
      project: services
      external_network: external
      interfaces:
        - subnet: internal-api-subnet

    - name: database-router
      project: data
      external_network: external
      interfaces:
        - subnet: database-subnet

    - name: cache-router
      project: data
      external_network: external
      interfaces:
        - subnet: cache-subnet

    - name: queue-router
      project: data
      external_network: external
      interfaces:
        - subnet: queue-subnet

nova:
  servers:
    # Platform - API Gateway cluster
    - name: api-gateway-1
      project: platform
      flavor: m1.medium
      image: debian-12-minimal
      network: ingress-network
      security_groups: [api-gateway]
      metadata:
        service: api-gateway
        instance: "1"

    - name: api-gateway-2
      project: platform
      flavor: m1.medium
      image: debian-12-minimal
      network: ingress-network
      security_groups: [api-gateway]
