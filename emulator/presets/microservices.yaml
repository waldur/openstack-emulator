cinder:
  volumes:
    # Observability
    - name: prometheus-1-data
      project: platform
      size: 200
      description: "Prometheus metrics storage"
      attach_to: prometheus-1
      device: "/dev/vdb"

    - name: prometheus-2-data
      project: platform
      size: 200
      description: "Prometheus metrics storage"
      attach_to: prometheus-2
      device: "/dev/vdb"

    - name: elasticsearch-1-data
      project: platform
      size: 500
      description: "Elasticsearch data"
