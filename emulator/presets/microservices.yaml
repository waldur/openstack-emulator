octavia:
  load_balancers:
    - name: api-gateway-lb
      project: platform
      vip_subnet: ingress-subnet
      listeners:
        - name: gateway-https
          protocol: HTTPS
          port: 443
          pool:
            name: api-gateway-pool
            protocol: HTTPS
            lb_algorithm: LEAST_CONNECTIONS
            members:
              - server: api-gateway-1
                port: 8080
              - server: api-gateway-2
                port: 8080
              - server: api-gateway-3
                port: 8080

    - name: frontend-lb
      project: services
      vip_subnet: frontend-subnet
      listeners:
        - name: web-ui-http
          protocol: HTTP
          port: 3000
          pool:
            name: web-ui-pool
            protocol: HTTP
            lb_algorithm: ROUND_ROBIN
            members:
              - server: web-ui-1
                port: 3000
              - server: web-ui-2
                port: 3000
              - server: web-ui-3
                port: 3000

    - name: postgres-lb
      project: data
      vip_subnet: database-subnet
      listeners:
        - name: postgres-tcp
          protocol: TCP
          port: 5432
          pool:
            name: postgres-pool
            protocol: TCP
            lb_algorithm: ROUND_ROBIN
            members:
              - server: postgres-replica-1
                port: 5432
              - server: postgres-replica-2
                port: 5432

    - name: redis-lb
      project: data
      vip_subnet: cache-subnet
      listeners:
        - name: redis-tcp
          protocol: TCP
          port: 6379
          pool:
            name: redis-pool
            protocol: TCP
            lb_algorithm: ROUND_ROBIN
            members:
              - server: redis-1
                port: 6379
              - server: redis-2
                port: 6379
              - server: redis-3
                port: 6379
              - server: redis-4
                port: 6379
              - server: redis-5
                port: 6379
              - server: redis-6
                port: 6379
