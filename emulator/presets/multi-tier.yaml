    - name: east-app-2
      project: az-east
      flavor: m1.medium
      image: ubuntu-22.04-server
      network: east-app-tier
      security_groups: [app-tier-sg]
      availability_zone: az-east
      metadata:
        tier: app
        az: east

    - name: east-app-3
      project: az-east
      flavor: m1.medium
      image: ubuntu-22.04-server
      network: east-app-tier
      security_groups: [app-tier-sg]
      availability_zone: az-east
      metadata:
        tier: app
        az: east

    - name: east-app-4
      project: az-east
      flavor: m1.medium
      image: ubuntu-22.04-server
      network: east-app-tier
      security_groups: [app-tier-sg]
      availability_zone: az-east
      metadata:
        tier: app
