      flavor: m1.small
      image: ubuntu-22.04-server
      network: security-bastion
      security_groups: [bastion-sg]
      metadata:
        role: bastion
        region: east

cinder:
  volumes:
    # West databases
    - name: west-db-primary-data
      project: az-west
      size: 500
