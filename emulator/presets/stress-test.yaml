name: stress-test
description: "High-volume stress test with 100+ servers, 50+ volumes, multiple networks - for performance and scale testing"

keystone:
  projects:
    - name: stress-compute
      description: "Compute stress test project"
      users:
        - name: stress-admin
          password: stress-2024
          email: stress@test.local
          roles: [admin, member]

    - name: stress-storage
      description: "Storage stress test project"
      users:
        - name: storage-admin
          password: storage-2024
          email: storage@test.local
          roles: [admin, member]

    - name: stress-network
      description: "Network stress test project"
      users:
        - name: network-admin
          password: network-2024
          email: network@test.local
          roles: [admin, member]

glance:
  images:
    - name: stress-image-small
      visibility: public
      disk_format: qcow2
      container_format: bare
      min_disk: 1
      min_ram: 256

    - name: stress-image-medium
      visibility: public
      disk_format: qcow2
      container_format: bare
      min_disk: 10
      min_ram: 1024

    - name: stress-image-large
      visibility: public
      disk_format: qcow2
      container_format: bare
      min_disk: 20
      min_ram: 2048

neutron:
  networks:
    # 10 networks for compute stress test
    - name: stress-net-01
      project: stress-compute
      subnets:
        - name: stress-subnet-01
          cidr: "10.1.0.0/24"
          gateway: "10.1.0.1"

    - name: stress-net-02
      project: stress-compute
      subnets:
        - name: stress-subnet-02
          cidr: "10.2.0.0/24"
          gateway: "10.2.0.1"

    - name: stress-net-03
      project: stress-compute
      subnets:
        - name: stress-subnet-03
          cidr: "10.3.0.0/24"
          gateway: "10.3.0.1"

    - name: stress-net-04
      project: stress-compute
      subnets:
        - name: stress-subnet-04
          cidr: "10.4.0.0/24"
          gateway: "10.4.0.1"

    - name: stress-net-05
      project: stress-compute
      subnets:
        - name: stress-subnet-05
          cidr: "10.5.0.0/24"
          gateway: "10.5.0.1"

    - name: stress-net-06
      project: stress-compute
      subnets:
        - name: stress-subnet-06
          cidr: "10.6.0.0/24"
          gateway: "10.6.0.1"

    - name: stress-net-07
      project: stress-compute
      subnets:
        - name: stress-subnet-07
          cidr: "10.7.0.0/24"
          gateway: "10.7.0.1"

    - name: stress-net-08
      project: stress-compute
      subnets:
        - name: stress-subnet-08
          cidr: "10.8.0.0/24"
          gateway: "10.8.0.1"

    - name: stress-net-09
      project: stress-compute
      subnets:
        - name: stress-subnet-09
          cidr: "10.9.0.0/24"
          gateway: "10.9.0.1"

    - name: stress-net-10
      project: stress-compute
      subnets:
        - name: stress-subnet-10
          cidr: "10.10.0.0/24"
          gateway: "10.10.0.1"

    # Storage network
    - name: storage-net-01
      project: stress-storage
      subnets:
        - name: storage-subnet-01
          cidr: "10.100.1.0/24"
          gateway: "10.100.1.1"

    - name: storage-net-02
      project: stress-storage
      subnets:
        - name: storage-subnet-02
          cidr: "10.100.2.0/24"
          gateway: "10.100.2.1"

    # Network test networks
    - name: nettest-net-01
      project: stress-network
      subnets:
        - name: nettest-subnet-01
          cidr: "10.200.1.0/24"
          gateway: "10.200.1.1"

    - name: nettest-net-02
      project: stress-network
      subnets:
        - name: nettest-subnet-02
          cidr: "10.200.2.0/24"
          gateway: "10.200.2.1"

    - name: nettest-net-03
      project: stress-network
      subnets:
        - name: nettest-subnet-03
          cidr: "10.200.3.0/24"
          gateway: "10.200.3.1"

  security_groups:
    - name: stress-allow-all
      description: "Allow all for stress testing"
      project: stress-compute
      rules:
        - direction: ingress
          protocol: tcp
          port_range_min: 1
          port_range_max: 65535
          remote_ip_prefix: "0.0.0.0/0"
        - direction: ingress
          protocol: udp
          port_range_min: 1
          port_range_max: 65535
          remote_ip_prefix: "0.0.0.0/0"
        - direction: ingress
          protocol: icmp
          remote_ip_prefix: "0.0.0.0/0"

  routers:
    - name: stress-router-01
      project: stress-compute
      external_network: external
      interfaces:
        - subnet: stress-subnet-01
        - subnet: stress-subnet-02

    - name: stress-router-02
      project: stress-compute
      external_network: external
      interfaces:
        - subnet: stress-subnet-03
        - subnet: stress-subnet-04

    - name: stress-router-03
      project: stress-compute
      external_network: external
      interfaces:
        - subnet: stress-subnet-05
        - subnet: stress-subnet-06

    - name: stress-router-04
      project: stress-compute
      external_network: external
      interfaces:
        - subnet: stress-subnet-07
        - subnet: stress-subnet-08

    - name: stress-router-05
      project: stress-compute
      external_network: external
      interfaces:
        - subnet: stress-subnet-09
        - subnet: stress-subnet-10

    - name: storage-router
      project: stress-storage
      external_network: external
      interfaces:
        - subnet: storage-subnet-01
        - subnet: storage-subnet-02

    - name: nettest-router
      project: stress-network
      external_network: external
      interfaces:
        - subnet: nettest-subnet-01
        - subnet: nettest-subnet-02
        - subnet: nettest-subnet-03

