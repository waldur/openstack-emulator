[project]
name = "openstack-emulator"
version = "0.4.3"
description = "OpenStack API emulator for testing purposes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OpenNode Team" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.0",
    # The embedded OpenID Provider signs RS256 tokens, and Keystone federation
    # validates bearer tokens issued by external providers against their JWKS.
    "pyjwt[crypto]>=2.8.0",
    # The OAuth 2 token endpoint takes form-encoded bodies, which FastAPI parses
    # through python-multipart.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
    # Pinned, not floated. CI installs these extras fresh on every run, so an
    # unpinned linter silently diverges from whatever a contributor has in their
    # environment, and the difference only shows up as a red pipeline. Bump
    # deliberately, and fix whatever the new version reports in the same commit.
    "ruff==0.16.1",
    "mypy==2.3.0",
    "openstacksdk>=4.7.1",
]

[project.scripts]
openstack-emulator = "emulator:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emulator*"]

[tool.setuptools.package-data]
"emulator.presets" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=emulator --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
